<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794">
  <defs>
    <!-- Rich Parchment Warm Base Gradient -->
    <radialGradient id="parchmentGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FAF5E8" />
      <stop offset="65%" stop-color="#F4EBD3" />
      <stop offset="100%" stop-color="#EEDFB8" />
    </radialGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A14A" />
      <stop offset="35%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#B9943F" />
      <stop offset="100%" stop-color="#8E6F22" />
    </linearGradient>

    <!-- Deep Navy Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2A5B" />
      <stop offset="100%" stop-color="#061836" />
    </linearGradient>
  </defs>

  <!-- Parchment Base Fill (Rich Cream / Warm Ivory) -->
  <rect x="0" y="0" width="1123" height="794" fill="url(#parchmentGrad)" />

  <!-- Outer Navy Heavy Frame -->
  <rect x="18" y="18" width="1087" height="758" fill="none" stroke="url(#navyGrad)" stroke-width="4.5" rx="3" />
  
  <!-- Outer Gold Accent Line -->
  <rect x="25" y="25" width="1073" height="744" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Inner Navy Frame -->
  <rect x="32" y="32" width="1059" height="730" fill="none" stroke="url(#navyGrad)" stroke-width="3" />

  <!-- Dotted Inner Gold Accent Line (Safe Print Margin) -->
  <rect x="38" y="38" width="1047" height="718" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.8" />

  <!-- CORNER ORNAMENTS (Top-Left) -->
  <g transform="translate(38, 38)">
    <path d="M 0 0 L 50 0 L 50 6 L 6 6 L 6 50 L 0 50 Z" fill="url(#goldGrad)" />
    <circle cx="20" cy="20" r="4" fill="url(#navyGrad)" />
    <circle cx="20" cy="20" r="2" fill="url(#goldGrad)" />
    <path d="M 12 12 L 30 12 L 30 14 L 14 14 L 14 30 L 12 30 Z" fill="url(#goldGrad)" />
  </g>

  <!-- CORNER ORNAMENTS (Top-Right) -->
  <g transform="translate(1085, 38) scale(-1, 1)">
    <path d="M 0 0 L 50 0 L 50 6 L 6 6 L 6 50 L 0 50 Z" fill="url(#goldGrad)" />
    <circle cx="20" cy="20" r="4" fill="url(#navyGrad)" />
    <circle cx="20" cy="20" r="2" fill="url(#goldGrad)" />
    <path d="M 12 12 L 30 12 L 30 14 L 14 14 L 14 30 L 12 30 Z" fill="url(#goldGrad)" />
  </g>

  <!-- CORNER ORNAMENTS (Bottom-Left) -->
  <g transform="translate(38, 756) scale(1, -1)">
    <path d="M 0 0 L 50 0 L 50 6 L 6 6 L 6 50 L 0 50 Z" fill="url(#goldGrad)" />
    <circle cx="20" cy="20" r="4" fill="url(#navyGrad)" />
    <circle cx="20" cy="20" r="2" fill="url(#goldGrad)" />
    <path d="M 12 12 L 30 12 L 30 14 L 14 14 L 14 30 L 12 30 Z" fill="url(#goldGrad)" />
  </g>

  <!-- CORNER ORNAMENTS (Bottom-Right) -->
  <g transform="translate(1085, 756) scale(-1, -1)">
    <path d="M 0 0 L 50 0 L 50 6 L 6 6 L 6 50 L 0 50 Z" fill="url(#goldGrad)" />
    <circle cx="20" cy="20" r="4" fill="url(#navyGrad)" />
    <circle cx="20" cy="20" r="2" fill="url(#goldGrad)" />
    <path d="M 12 12 L 30 12 L 30 14 L 14 14 L 14 30 L 12 30 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Top Center Ornamental Crest Accent -->
  <g transform="translate(561.5, 32)">
    <polygon points="-40,0 40,0 0,14" fill="url(#goldGrad)" />
    <circle cx="0" cy="7" r="3" fill="#0B2A5B" />
  </g>
</svg>
