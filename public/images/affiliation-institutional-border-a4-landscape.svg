<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794">
  <defs>
    <!-- Gold Gradient for Decorative Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A14A" />
      <stop offset="50%" stop-color="#E7D49A" />
      <stop offset="100%" stop-color="#9A7B31" />
    </linearGradient>

    <!-- Deep Navy Gradient for Borders -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2A5B" />
      <stop offset="100%" stop-color="#123A73" />
    </linearGradient>
  </defs>

  <!-- Background Base Fill (Warm Ivory / Soft White) -->
  <rect x="0" y="0" width="1123" height="794" fill="#FFFDF7" />

  <!-- Outer Navy Frame -->
  <rect x="20" y="20" width="1083" height="754" fill="none" stroke="url(#navyGrad)" stroke-width="4" rx="3" />
  
  <!-- Outer Thin Gold Frame -->
  <rect x="27" y="27" width="1069" height="740" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Inner Navy Frame -->
  <rect x="34" y="34" width="1055" height="726" fill="none" stroke="url(#navyGrad)" stroke-width="2.5" />

  <!-- Inner Gold Accent Line (Dashed subtle) -->
  <rect x="39" y="39" width="1045" height="716" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8 4" opacity="0.7" />

  <!-- CORNER ORNAMENTS (Top-Left) -->
  <g transform="translate(39, 39)">
    <path d="M 0 0 L 45 0 L 45 6 L 6 6 L 6 45 L 0 45 Z" fill="url(#goldGrad)" />
    <circle cx="18" cy="18" r="3.5" fill="url(#navyGrad)" />
    <path d="M 10 10 L 26 10 L 26 12 L 12 12 L 12 26 L 10 26 Z" fill="url(#goldGrad)" />
  </g>

  <!-- CORNER ORNAMENTS (Top-Right) -->
  <g transform="translate(1084, 39) scale(-1, 1)">
    <path d="M 0 0 L 45 0 L 45 6 L 6 6 L 6 45 L 0 45 Z" fill="url(#goldGrad)" />
    <circle cx="18" cy="18" r="3.5" fill="url(#navyGrad)" />
    <path d="M 10 10 L 26 10 L 26 12 L 12 12 L 12 26 L 10 26 Z" fill="url(#goldGrad)" />
  </g>

  <!-- CORNER ORNAMENTS (Bottom-Left) -->
  <g transform="translate(39, 755) scale(1, -1)">
    <path d="M 0 0 L 45 0 L 45 6 L 6 6 L 6 45 L 0 45 Z" fill="url(#goldGrad)" />
    <circle cx="18" cy="18" r="3.5" fill="url(#navyGrad)" />
    <path d="M 10 10 L 26 10 L 26 12 L 12 12 L 12 26 L 10 26 Z" fill="url(#goldGrad)" />
  </g>

  <!-- CORNER ORNAMENTS (Bottom-Right) -->
  <g transform="translate(1084, 755) scale(-1, -1)">
    <path d="M 0 0 L 45 0 L 45 6 L 6 6 L 6 45 L 0 45 Z" fill="url(#goldGrad)" />
    <circle cx="18" cy="18" r="3.5" fill="url(#navyGrad)" />
    <path d="M 10 10 L 26 10 L 26 12 L 12 12 L 12 26 L 10 26 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Top Center Accent Motif -->
  <g transform="translate(561.5, 34)">
    <polygon points="-35,0 35,0 0,12" fill="url(#goldGrad)" />
    <circle cx="0" cy="6" r="2.5" fill="#0B2A5B" />
  </g>
</svg>
